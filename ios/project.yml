name: CardGame3
options:
  bundleIdPrefix: com.azzamalrashed
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  CardGame3:
    type: application
    platform: iOS
    sources: [CardGame3]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.azzamalrashed.cardgame3
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
schemes:
  CardGame3:
    build:
      targets:
        CardGame3: all
    run:
      config: Debug
    archive:
      config: Release
  CardGame3 (Emulators):
    build:
      targets:
        CardGame3: all
    run:
      config: Debug
      environmentVariables:
        USE_EMULATORS: "1"
